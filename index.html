<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Shop products featured by Affinova on social media."><title>Affinova | Featured Finds</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171313;background:#fffaf7;min-height:100vh}body:before{content:"";position:fixed;inset:-20vh -20vw auto;height:65vh;background:radial-gradient(circle at 28% 40%,rgba(255,177,151,.42),transparent 34%),radial-gradient(circle at 72% 25%,rgba(221,181,255,.32),transparent 31%);filter:blur(18px);z-index:-1}.wrap{width:min(100% - 28px,620px);margin:auto;padding:45px 0 70px}.brand{text-align:center;margin-bottom:34px}.logo{width:105px;height:105px;object-fit:cover;border-radius:50%;box-shadow:0 12px 35px rgba(52,30,24,.16)}h1{font-size:34px;line-height:1;margin:17px 0 9px;letter-spacing:-1.3px}.intro{margin:0 auto;color:#716966;font-size:15px;line-height:1.55;max-width:420px}.label{margin:31px 4px 13px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#8d7770}.links{display:grid;gap:13px}.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;padding:12px;background:rgba(255,255,255,.88);border:1px solid rgba(79,50,43,.10);border-radius:22px;box-shadow:0 7px 24px rgba(76,49,41,.055);transition:.18s ease}.card:hover{transform:translateY(-2px);box-shadow:0 11px 30px rgba(76,49,41,.10)}.product-img,.product-placeholder{width:76px;height:76px;flex:0 0 76px;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,#ffe5d8,#eadcff)}.product-placeholder{display:grid;place-items:center;font-size:28px}.copy{min-width:0;flex:1}.name{font-size:15px;line-height:1.28;font-weight:750;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cta{display:block;font-size:12px;color:#e66a19;margin-top:6px;font-weight:750}.arrow{font-size:22px;color:#8b7a75;padding-right:4px}.foot{text-align:center;color:#a0928d;font-size:12px;margin-top:28px}.status{text-align:center;color:#8d7770;font-size:13px;padding:18px}@media(max-width:420px){.wrap{width:min(100% - 22px,620px);padding-top:32px}.logo{width:92px;height:92px}h1{font-size:30px}.card{border-radius:19px}.product-img,.product-placeholder{width:70px;height:70px;flex-basis:70px}}</style></head><body><main class="wrap"><header class="brand"><img class="logo" alt="Affinova logo" src="./affinova-logo-clean.svg"><h1>Affinova Finds</h1><p class="intro">Products featured on our social pages. Tap an item to see the full details.</p></header><div class="label">Featured products</div><section class="links" id="products"><div class="status">Loading featured products…</div></section><p class="foot">Affinova · Explore · Discover · Shop Smarter</p></main><script>const API='https://script.google.com/macros/s/AKfycbwt7uH76M1xW0es4lNf0bkt-VpoKolC9pvLTBQdt4Mc6xLsE9LoVYXWct_m63-zdgbo/exec';const knownImages={'28-62-120-in-1-electric-screwdriver-precision-set-power-tool-rechargeable-magnetic-small-bit-for-xiaomi-mobile-38359836':'https://ae-pic-a1.aliexpress-media.com/kf/Sb59919e71e744f4d84beedc08f3ec01bE.jpg','universal-car-phone-holder-for-iphone-xs-8-11-12-13-14-15-pro-max-air-vent-mount-clip-in-car-phone-stand-suppo-03521966':'https://ae-pic-a1.aliexpress-media.com/kf/H09a9a86450e54e19a7b757db8a858985d.jpg'};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const box=document.getElementById('products');try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('API');const products=await r.json();if(!Array.isArray(products))throw Error('Data');box.innerHTML=products.map(p=>{const img=p.image||knownImages[p.slug];return `<a class="card" href="${esc(p.url)}">${img?`<img class="product-img" src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">`:'<span class="product-placeholder" aria-hidden="true">🛍️</span>'}<span class="copy"><span class="name">${esc(p.name)}</span><span class="cta">View product</span></span><span class="arrow">›</span></a>`}).join('')||'<div class="status">No posted products yet.</div>'}catch(e){box.innerHTML='<div class="status">Products are temporarily unavailable. Please refresh shortly.</div>'}}load();</script></body></html>
